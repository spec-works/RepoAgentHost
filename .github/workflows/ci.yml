name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: |
          if ($IsMacOS) {
            $physicalTemp = & /bin/sh -c 'cd "${TMPDIR:-/tmp}" && pwd -P'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the physical temporary directory.' }
            $env:TMPDIR = $physicalTemp.TrimEnd('/') + '/'
          }
          dotnet test ./RepoAgentHost.sln --configuration Release
      - name: Check whitespace
        run: git diff --check
      - name: Package Agent Plugin
        if: runner.os == 'Windows'
        run: .\scripts\pack-plugin.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: repo-agent-host-plugin
          path: artifacts/plugins/*.zip
          if-no-files-found: error
